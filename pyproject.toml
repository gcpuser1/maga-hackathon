[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maga"]

[project]
name = "maga"
version = "0.1.0"
description = "Mine coding-agent session transcripts for repeated work and turn it into tested tools."
readme = "README.md"
requires-python = ">=3.13.0,<3.14.0"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai-slim[google]>=2.46.0",
]

[dependency-groups]
dev = [
    "conventional-pre-commit>=4.4.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",     # No copyright-header policy in this repository
    "D",       # Docstring rules: too slow for a hackathon; names and types carry the meaning
    "COM812",  # Trailing comma: conflicts with ruff format
    "E501",    # Line length: ruff format owns it
    "TD002",   # TODO author
    "TD003",   # TODO issue link
    "FIX002",  # TODO comments are permitted
]
# These rules need a person. Auto-fix must not rename or restructure code.
unfixable = ["PL", "N"]

[tool.ruff.lint.per-file-ignores]
"src/maga/gate2.py" = [
    "S603",     # Gate 2 runs `claude -p` with a fixed argument list; the task text is a constant
    "S607",     # `claude` comes from PATH
]
"src/maga/verifier.py" = [
    "S603",     # Gate 1 runs `docker` with a fixed argument list; no shell, no transcript text
    "S607",     # `docker` comes from PATH, as on any developer machine
]
"src/maga/gate1/*.py" = [
    "S603",     # The harness runs the script under test, and the probe starts vite: that is their job
    "S607",     # `vite` comes from PATH by contract (generator.CONSTRAINTS)
    "INP001",   # Copied into the Gate 1 container as plain files, never imported as a package
]
"tests/**/*.py" = [
    "S101",     # pytest uses assert
    "PLR2004",  # Literal expected values are the point of a test
    "INP001",   # tests/ is not a package; pytest uses importlib import mode
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["maga"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
# Ratchet: a suppression comment that suppresses nothing is an error.
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
